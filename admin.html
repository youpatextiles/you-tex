<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace propriétaire - Youpa Textiles</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/galerie.css">
</head>
<body>
<main class="admin">
  <h1>Espace propriétaire</h1>
  <a href="index.html">← Retour au site</a>
  

  <section id="connexion">
    <form id="f-connexion">
      <label>E-mail <input type="email" id="email" required autocomplete="username"></label>
      <label>Mot de passe
    <span class="champ-mdp">
    <input type="password" id="mdp" required autocomplete="current-password">
    <button type="button" class="oeil" id="oeil" aria-label="Afficher le mot de passe">👁</button>
  </span>
</label>
      <button class="btn" type="submit">Se connecter</button>
    </form>
  </section>

  <section id="panneau" hidden>
    <button class="lien" id="deco" type="button">Se déconnecter</button>
    <h2>Ajouter un article</h2>
    <form id="f-article">
      <label>Catégorie <select id="cat"></select></label>
      <label>Nom de l’article (facultatif) <input id="nom" maxlength="80"></label>
      <label>Prix <input id="prix" maxlength="40" placeholder="ex : 15 000 FCFA"></label>
      <label>Photos (plusieurs possibles) <input type="file" id="fichiers" accept="image/*" multiple></label>
      <div class="apercu" id="apercu"></div>
      <button class="btn" type="submit">Enregistrer l’article</button>
    </form>
    <p id="msg" role="status"></p>
    <h2>Articles en ligne</h2>
    <div id="liste"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
